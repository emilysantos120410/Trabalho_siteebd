<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte Azul — Receba Ofertas de Viagem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(rgba(3, 105, 161, 0.75), rgba(2, 132, 199, 0.85)),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .icone {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            color: #0369a1;
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
        }

        p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .campo {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        button {
            width: 100%;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #0369a1;
        }

        #mensagem-sucesso {
            display: none;
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 1.2rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icone">✈️</div>
        <h1>Planeje sua Viagem</h1>
        <p>Deixe seu contato para receber roteiros e promoções exclusivas.</p>

        <form id="form-viagem">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <button type="submit">Quero Viajar</button>
        </form>

        <div id="mensagem-sucesso">
            <strong>Cadastro realizado!</strong>
            <p id="texto-sucesso" style="margin: 0.5rem 0 0; color: #065f46;"></p>
        </div>
    </div>

    <script>
        document.getElementById('form-viagem').addEventListener('submit', function(evento) {
            evento.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;

            document.getElementById('texto-sucesso').innerText = 
                `Obrigado, ${nome}! Enviaremos novidades para ${email}.`;

            this.style.display = 'none';
            document.getElementById('mensagem-sucesso').style.display = 'block';
        });
    </script>

</body>
</html>
